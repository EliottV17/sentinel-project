name: CI & Security Scan

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API (lint, typecheck, tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sentinel_tests_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: sentinel-api

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/sentinel_tests_db
      SECRET_KEY: "super-secret-key-para-tests-ci"
      DEMO_USER_EMAIL: demo@sentinel.dev
      DEMO_USER_PASSWORD: "DemoPassword123!"
      DEMO_MAX_MONITORS: 3
      DEMO_MIN_FREQUENCY_SECONDS: 60
      DEMO_ACCESS_TOKEN_EXPIRE_MINUTES: 15
      DEMO_MONITORS_MANIFEST_PATH: ../demo-monitors.json

    steps:
      - uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Push database schema
        run: bunx prisma db push

      - name: Seed demo account and monitors
        run: bun run prisma:seed

      - name: Build
        run: bun run build

      - name: Build API image and verify entrypoint
        run: |
          docker build --tag sentinel-api-ci .
          docker run --rm --entrypoint sh sentinel-api-ci -c 'test -f /app/dist/main.js'
          sh test/docker-entrypoint.test.sh

      - name: Unit Tests
        run: bun run test

      - name: End-to-End Tests
        run: bun run test:e2e

  worker:
    name: Worker (build, vet, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sentinel-worker

    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.25"
          cache-dependency-path: sentinel-worker/go.sum

      - name: Vet
        run: go vet ./...

      - name: Tests
        run: go test -v ./...

      - name: Build
        run: go build ./cmd/worker/

      - name: Run Govulncheck (Go Security Scanner)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          govulncheck ./...

  frontend:
    name: Frontend (lint, typecheck, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

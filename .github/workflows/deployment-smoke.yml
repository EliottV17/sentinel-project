name: Deployment smoke

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      run_arm64:
        description: Build production images for ARM64 (build-only, non-blocking)
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  production-smoke-amd64:
    name: Production smoke (AMD64)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Assert AMD64 runner
        run: test "$(uname -m)" = x86_64

      - name: Validate smoke scripts and cleanup helpers
        run: |
          bash -n test/smoke/production-smoke.sh
          bash -n test/smoke/production-smoke.test.sh
          timeout --foreground 30s bash test/smoke/production-smoke.test.sh

      - name: Build and run isolated production smoke
        run: timeout --foreground 900s bash test/smoke/production-smoke.sh

  production-build-arm64:
    name: Production image build (ARM64, non-blocking)
    if: github.event_name == 'workflow_dispatch' && inputs.run_arm64 == true
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production images for ARM64 (no push)
        id: arm64-build
        run: |
          docker buildx build --platform linux/arm64 --tag sentinel-api:arm64 --load \
            --file sentinel-api/Dockerfile.prod ./sentinel-api
          docker buildx build --platform linux/arm64 --tag sentinel-frontend:arm64 --load \
            --build-arg VITE_API_BASE_URL= \
            --build-arg VITE_DEMO_USER_EMAIL=phase4-demo@example.test \
            --build-arg 'VITE_DEMO_USER_PASSWORD=DemoTestPassword123!' \
            --file frontend/Dockerfile.prod ./frontend
          docker buildx build --platform linux/arm64 --tag sentinel-worker:arm64 --load \
            --file sentinel-worker/Dockerfile.prod ./sentinel-worker

      - name: Summarize ARM64 build-only result
        if: always()
        run: |
          {
            echo 'This optional, non-blocking job only builds local ARM64 images; it does not run them or publish them.'
            if [[ '${{ steps.arm64-build.outcome }}' == success ]]; then
              echo 'All three production Dockerfiles built for linux/arm64.'
            else
              echo 'An ARM64 image build failed; inspect the preceding Docker output for exact native Argon2/Prisma stage errors before considering any base-image change.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

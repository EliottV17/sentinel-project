services:
  db:
    image: postgres:17-alpine
    container_name: sentinel_db
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=sentinel_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sentinel_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./sentinel-api
    container_name: sentinel_api
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/sentinel_db
      SECRET_KEY: ${SECRET_KEY:-change-me}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      DEMO_USER_EMAIL: ${DEMO_USER_EMAIL:-demo@sentinel.dev}
      DEMO_USER_PASSWORD: "${DEMO_USER_PASSWORD:-DemoPassword123!}"
      DEMO_ACCESS_TOKEN_EXPIRE_MINUTES: ${DEMO_ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      DEMO_MAX_MONITORS: ${DEMO_MAX_MONITORS:-3}
      DEMO_MIN_FREQUENCY_SECONDS: ${DEMO_MIN_FREQUENCY_SECONDS:-60}
      DEMO_MONITORS_MANIFEST_PATH: ${DEMO_MONITORS_MANIFEST_PATH:-/app/demo-monitors.json}
      STATUS_OWNER_EMAIL: ${STATUS_OWNER_EMAIL:-}
      STATUS_MONITORS_MANIFEST_PATH: ${STATUS_MONITORS_MANIFEST_PATH:-/app/status-monitors.json}
    ports:
      - "8000:8000"
    volumes:
      - ./demo-monitors.json:/app/demo-monitors.json:ro
      - ./status-monitors.json:/app/status-monitors.json:ro
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:8000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 90s

  worker:
    build: ./sentinel-worker
    container_name: sentinel_worker
    restart: always
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/sentinel_db
      DEMO_USER_EMAIL: ${DEMO_USER_EMAIL:-demo@sentinel.dev}
      DEMO_RESET_INTERVAL_MINUTES: ${DEMO_RESET_INTERVAL_MINUTES:-60}
      DEMO_MONITORS_MANIFEST_PATH: ${DEMO_MONITORS_MANIFEST_PATH:-/app/demo-monitors.json}
    volumes:
      - ./demo-monitors.json:/app/demo-monitors.json:ro

  frontend:
    build:
      context: ./frontend
      # Leave empty for same-origin /api (nginx proxies to the api service), or
      # set e.g. VITE_API_BASE_URL=https://api.example.com for a split origin.
      args:
        VITE_API_BASE_URL: ""
        VITE_DEMO_USER_EMAIL: ${DEMO_USER_EMAIL:-demo@sentinel.dev}
        VITE_DEMO_USER_PASSWORD: "${DEMO_USER_PASSWORD:-DemoPassword123!}"
    container_name: sentinel_frontend
    restart: always
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "5173:80"

volumes:
  postgres_data:
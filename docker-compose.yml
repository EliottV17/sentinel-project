services:
  db:
    image: postgres:17-alpine
    container_name: sentinel_db
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=sentinel_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sentinel_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./sentinel-api
    container_name: sentinel_api
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/sentinel_db
      SECRET_KEY: ${SECRET_KEY:-change-me}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
    ports:
      - "8000:8000"

  worker:
    build: ./sentinel-worker
    container_name: sentinel_worker
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/sentinel_db

  frontend:
    build:
      context: ./frontend
      # Leave empty for same-origin /api (nginx proxies to the api service), or
      # set e.g. VITE_API_BASE_URL=https://api.example.com for a split origin.
      args:
        VITE_API_BASE_URL: ""
    container_name: sentinel_frontend
    restart: always
    depends_on:
      - api
    ports:
      - "5173:80"

volumes:
  postgres_data:
# SPA served by nginx, with /api proxied to the backend api service so the
# whole stack is reachable from a single origin (same contract as the dev proxy).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Backend API (preserves the /api prefix; api is the compose service name).
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA router fallback: unknown paths serve index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

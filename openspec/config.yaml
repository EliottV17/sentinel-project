# OpenSpec project configuration — Sentinel
# Generated by SDD init. Safe to edit by hand; keep keys stable so later
# SDD phases (explore / plan / implement / review) can re-read this file.

schema: spec-driven

# ---------------------------------------------------------------------------
# Project context (injected into every SDD phase request)
# ---------------------------------------------------------------------------
context: |
  Project: sentinel — asynchronous uptime monitoring & alerting system.
  Repo root: /home/eliott/Projects/sentinel-project (git root; no root-level tooling).

  Components:
  - sentinel-api/  Python (requires-python >=3.12; CI runs 3.12). FastAPI + SQLModel
                   + asyncpg + async Alembic + REST-only (checking runs in the Go worker).
                   Layout: app/{api/v1/endpoints,core,db,models,schemas,services,tests}.
  - sentinel-worker/ Go 1.25 service. pgx pool against the SAME PostgreSQL database;
                   polls every 2s for monitors that are *due* (last_checked_at + frequency),
                   runs the checker, writes check_result, updates monitor, writes alert on
                   transition. Layout: cmd/worker, internal/{checker,config,db,models,worker}.
  - frontend/      EMPTY (.gitkeep only). No UI exists yet; do not assume any frontend
                   framework, package manager, or build command exists.
  - PostgreSQL 17 via docker-compose.yml at repo root (service `db` -> sentinel_db).

  Domain model: monitor -> check_result (immutable log, one row per check)
                -> alert (ONLY on state transitions: healthy->unhealthy = "down",
                   unhealthy->healthy = "recovery"). Auth: JWT (pwdlib/argon2, pyjwt).
  Checker extension point (Python): implement BaseChecker + @register in
    app/core/checkers/; the checker registry is a preserved API-side extension point
    (currently no production caller; the Go worker has its own registry). The new module
    MUST be imported (e.g. in app/main.py) or it never registers.
  Checker extension point (Go): internal/checker registry, mirror of the Python one.
  Everything DB-facing is async (asyncpg / async SQLAlchemy sessions / async Alembic).
  Single engine since remove-api-apscheduler: only the Go worker writes check results;
  the former dual-engine duplicate-row hazard is resolved.

  Commands (run from the stated directory):
  - API setup:   cd sentinel-api && uv sync --group dev
  - DB up:       docker compose up -d   (repo-root compose file; note: file is `docker-compose.yml`, not `compose.yaml`)
  - Migrations:  cd sentinel-api && alembic upgrade head   (needs .env DATABASE_URL)
  - Dev server:  cd sentinel-api && uv run uvicorn app.main:app --reload
  - API tests:   cd sentinel-api && uv run pytest
  - API single:  cd sentinel-api && uv run pytest app/tests/api/test_monitors.py::test_create_monitor
  - API lint:    cd sentinel-api && uv run ruff check .
  - API format:  cd sentinel-api && uv run ruff format .
  - API types:   cd sentinel-api && uv run pyright
  - Worker test: cd sentinel-worker && go test ./...
  - Worker vet:  cd sentinel-worker && go vet ./...
  - Worker build:cd sentinel-worker && go build ./cmd/worker/

  Test prerequisites (hard requirements, not optional):
  - `docker compose up` creates ONLY sentinel_db. The test database
    sentinel_tests_db must be created manually:
    createdb / psql -c 'CREATE DATABASE sentinel_tests_db' against the local postgres.
  - The test DB URL is HARDCODED in sentinel-api/app/tests/conftest.py (line ~13):
    postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/sentinel_tests_db
    It is not readable from the environment, so it cannot be overridden per run.
  - Tables are create_all/drop_all per test function via SQLModel.metadata — Alembic
    migrations do NOT run for tests, so schema changes need both a migration AND a
    model change or tests silently diverge.
  - pytest config: asyncio_mode = "auto", testpaths = ["app/tests"].
  - Authenticated tests use the `auth_headers` fixture (async closure returning a
    Bearer header from /api/v1/auth/login) and `registered_user`/`monitor_payload`.
  - sentinel-worker currently has ZERO *_test.go files, and CI only runs go vet +
    go build + govulncheck for it. Any behaviour change in Go must land with new
    tests plus (if CI should gate it) a `go test ./...` CI step.

  CI (.github/workflows/ci.yml) gates: API = ruff check, ruff format --check, pyright,
  pytest, pip-audit (with a postgres:17 service). Worker = go vet, go build, govulncheck.
  A change is not done until the matching CI commands pass locally.

  Style/conventions: ruff line-length 88, lint rules E,F,B,I; type hints expected
  (pyright strict-ish); Chinese/Spanish comments exist in code — keep comments in the
  language already used by the file being edited.

# ---------------------------------------------------------------------------
# Testing policy
# ---------------------------------------------------------------------------
testing:
  mode: strict_tdd
  enforce: red-green-refactor
  rules:
    - Write the failing test first and run it to confirm RED before any implementation.
    - Record the failing-test output (command + assertion) in the implement-phase log.
    - No production line may ship without a test that fails without it.
    - Refactor only while green; re-run the focused suite and then the full suite.
    - Bug fixes require a regression test that reproduces the bug first.
  runners:
    api:
      cwd: sentinel-api
      focused: uv run pytest {test_path}
      full: uv run pytest
      static: [uv run ruff check ., uv run ruff format --check ., uv run pyright]
    worker:
      cwd: sentinel-worker
      focused: go test ./internal/{package}/ -run {TestName} -count=1
      full: go test ./...
      static: [go vet ./...]
    frontend:
      cwd: frontend
      setup: npm ci
      focused: npx vitest run {test_path}
      full: npm run test            # vitest run
      build: npm run build          # tsc -b && vite build
      static: [npm run lint, npm run typecheck]
      note: 'replaces "status: none" once PR 2 lands'
  prerequisites:
    - docker compose up -d  # repo-root compose -> sentinel_db + postgres on :5432
    - CREATE DATABASE sentinel_tests_db  # manual, once per machine
    - export SECRET_KEY (or rely on the CI test value) for auth tests
  coverage_expectations:
    api: new endpoints get API-level tests in app/tests/api/ (ASGITransport + AsyncClient)
    worker: loop/checker logic gets table-driven tests with a real or faked pgx pool

# ---------------------------------------------------------------------------
# Phase rules
# ---------------------------------------------------------------------------
rules:
  init:
    - Do not create openspec/changes/ artifacts here; explore owns them.
    - Verify test runners and DB prerequisites are real before planning any phase.
  explore:
    - Use CodeGraph (repo root /home/eliott/Projects/sentinel-project) before broad grep/read.
    - Every proposal must state which component(s) it touches: api, worker, frontend, schema.
    - Schema-touching proposals must name the Alembic revision plan explicitly.
  plan:
    - Tasks must be ordered red -> green -> refactor per behaviour slice, with exact commands.
    - Each task must fit the review budget (<= 400 changed lines); split otherwise.
    - Tasks that add a Python checker must include the import-in-main.py step.
    - Tasks that change shared schema must cover BOTH engines' write paths.
  implement:
    - One work unit per commit; keep tests and docs in the same commit as the code.
    - Run the focused test, then the component full suite, then static checks.
    - Never weaken or delete an existing test to make a change pass; report instead.
  review:
    - Report the exact commands run and their output, plus diff line count vs budget.
    - Flag any dual-engine double-check or notification-flood risk explicitly.
  archive:
    - Update openspec specs only for behaviour that is now implemented and green.

# ---------------------------------------------------------------------------
# Delivery / review budget (matches the resolved SDD session preferences)
# ---------------------------------------------------------------------------
delivery:
  strategy: ask-on-risk
  review_budget_lines: 400
  chain_strategy: deferred   # decided only when chaining is selected
  exception_policy: exception-ok requires explicit human acceptance; never inferred

risks_known:
  - sentinel-worker has no tests and no go-test CI step, so regressions there are invisible.
  - RESOLVED (remove-api-apscheduler): the API scheduler was removed; the Go worker is the
    sole engine — it is required: if it is not running, no monitor is ever checked and no
    alerts fire.
  - Hardcoded test DB URL in app/tests/conftest.py; not overridable by env var.
  - frontend/ is empty; .python-version holds the literal string ">=3.12" instead of a real pin,
    and README advertises Python 3.12 while the session brief mentioned 3.14.

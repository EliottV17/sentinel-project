[project]
name = "sentinel-api"
version = "0.1.0"
description = "Motor de monitoreo y alertas asíncrono"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlmodel",
    "alembic",
    "asyncpg",
    "pwdlib[argon2]",
    "pyjwt>=2.13.0",
    "python-dotenv",
    "httpx",
    "pydantic-settings>=2.14.2",
    "argon2-cffi>=25.1.0",
    "email-validator>=2.3.0",
    "python-multipart>=0.0.31",
    "apscheduler>=3.11.2",
]

[dependency-groups]
dev = [
    "ruff",
    "pytest",
    "pytest-asyncio",
    "pyright",
    "pip-audit",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "B", "I"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"migrations/env.py" = ["F401", "I001"]
"migrations/versions/*.py" = ["F401", "I001"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["app/tests"]

[tool.uv]
override-dependencies = [
    "mako>=1.3.12",
    "idna>=3.15",
    "starlette>=1.3.1",
]
